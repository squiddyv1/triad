<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Triad: autonomous security assessment from one command">
  <!--
    Monospace throughout so the text extents stay predictable without measuring a font.
    Every text colour clears WCAG AA against the lightest background stop (#0b1420):
    the title 15.9:1, the tagline 6.5:1, the flow arrows 6.0:1, the accents 10:1 or more.

    The mark and the text are one centred block, and the rule ends exactly where the
    longest text line ends so it bookends the content instead of stopping in arbitrary
    space. Measured from the rendered pixels: margins 220 left against 221 right, and 57
    above against 57 below.
  -->
  <title>Triad</title>
  <defs>
    <linearGradient id="bn-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1420"/>
      <stop offset="0.55" stop-color="#0a0f17"/>
      <stop offset="1" stop-color="#0c1016"/>
    </linearGradient>
    <pattern id="bn-dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#1e293b" opacity="0.55"/>
    </pattern>
    <radialGradient id="bn-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bn-edge" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="bn-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.15"/>
    </linearGradient>
    <clipPath id="bn-clip"><rect width="1280" height="320"/></clipPath>
  </defs>

  <rect width="1280" height="320" fill="url(#bn-bg)"/>
  <rect width="1280" height="320" fill="url(#bn-dots)"/>
  <!-- the glow is wider than the canvas on purpose; clip it so the file is in-bounds -->
  <g clip-path="url(#bn-clip)">
    <circle cx="311" cy="148" r="230" fill="url(#bn-glow)"/>
  </g>

  <!-- the mark, same construction as assets/logo.svg -->
  <g transform="translate(221,58)">
    <rect width="180" height="180" rx="40" fill="#0c141f" stroke="#22303f" stroke-width="2"/>
    <line x1="46.7" y1="125.5" x2="90" y2="50.5" stroke="#a78bfa" stroke-width="3.4"
          stroke-dasharray="9 7" stroke-linecap="round" opacity="0.85"/>
    <line x1="46.7" y1="125.5" x2="133.3" y2="125.5" stroke="#a78bfa" stroke-width="3.4"
          stroke-dasharray="9 7" stroke-linecap="round" opacity="0.85"/>
    <line x1="90" y1="50.5" x2="133.3" y2="125.5" stroke="url(#bn-edge)" stroke-width="6"
          stroke-linecap="round"/>
    <circle cx="90" cy="50.5" r="12" fill="#22d3ee"/>
    <circle cx="133.3" cy="125.5" r="12" fill="#fbbf24"/>
    <circle cx="46.7" cy="125.5" r="12" fill="#a78bfa"/>
    <circle cx="90" cy="50.5" r="5.2" fill="#0c141f"/>
    <circle cx="133.3" cy="125.5" r="5.2" fill="#0c141f"/>
    <circle cx="46.7" cy="125.5" r="5.2" fill="#0c141f"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">
    <text x="445" y="126" font-size="88" font-weight="700" letter-spacing="8" fill="#e8eef6">TRIAD</text>
    <text x="447" y="180" font-size="21" fill="#8b9bad">autonomous security assessment from one command</text>
    <text x="447" y="226" font-size="20" fill="#8494a7">
      <tspan fill="#22d3ee">strix scan</tspan>
      <tspan>  &#8594;  </tspan>
      <tspan fill="#dbe4ee">feed</tspan>
      <tspan>  &#8594;  </tspan>
      <tspan fill="#fbbf24">cairn graph</tspan>
      <tspan>  &#8594;  </tspan>
      <tspan fill="#dbe4ee">report</tspan>
    </text>
  </g>

  <rect x="221" y="260" width="838" height="3" rx="1.5" fill="url(#bn-rule)"/>
</svg>
