<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Triad">
  <!--
    Triad mark: three components around one flow.
    Solid edge, Strix to Cairn, is the path that does the work; the dashed ones are the
    optional control layer. Colours match the banner and the README.

    Long opaque dashes rather than fine ones, so the mark still reads at 32-64px where a
    tight dash pattern blurs into noise. Every element clears 3:1 against the tile (nodes
    6.2:1 or better, the dashed edges 5:1).

    The triangle is centred by its bounding box, x 34.7..145.3 and y 38.5..137.5 in its
    own 180-unit box, then nudged 2 units up because a base of two nodes carries more
    weight than the single vertex. Its bbox centre lands at (90, 88) against a box centre
    of (90, 90), which is why the group is translated a plain 22,22 and nothing else.
  -->
  <title>Triad</title>
  <defs>
    <linearGradient id="mark-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111d2b"/>
      <stop offset="1" stop-color="#070a0f"/>
    </linearGradient>
    <radialGradient id="mark-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark-edge" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#mark-bg)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#22303f" stroke-width="3"/>
  <circle cx="256" cy="228" r="196" fill="url(#mark-glow)"/>

  <g transform="translate(22,22) scale(2.6)">
    <!-- Hermes: present if you want it, which is what the dashes say -->
    <line x1="46.7" y1="125.5" x2="90" y2="50.5" stroke="#a78bfa" stroke-width="3.4"
          stroke-dasharray="9 7" stroke-linecap="round" opacity="0.85"/>
    <line x1="46.7" y1="125.5" x2="133.3" y2="125.5" stroke="#a78bfa" stroke-width="3.4"
          stroke-dasharray="9 7" stroke-linecap="round" opacity="0.85"/>

    <!-- Strix feeds Cairn: the flow the whole project is about -->
    <line x1="90" y1="50.5" x2="133.3" y2="125.5" stroke="url(#mark-edge)" stroke-width="6"
          stroke-linecap="round"/>

    <circle cx="90" cy="50.5" r="12" fill="#22d3ee"/>
    <circle cx="133.3" cy="125.5" r="12" fill="#fbbf24"/>
    <circle cx="46.7" cy="125.5" r="12" fill="#a78bfa"/>
    <circle cx="90" cy="50.5" r="5.2" fill="#070a0f"/>
    <circle cx="133.3" cy="125.5" r="5.2" fill="#070a0f"/>
    <circle cx="46.7" cy="125.5" r="5.2" fill="#070a0f"/>
  </g>
</svg>
